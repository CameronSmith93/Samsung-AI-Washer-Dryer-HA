# Home Assistant package: template sensors used by the washer and dryer cards.
# Put this file in /config/packages/ (see README) and restart Home Assistant.
template:
- sensor:
  - name: Samsung washer display cycle start
    unique_id: samsung_washer_display_cycle_start
    icon: mdi:timer-play-outline
    state: |-
      {%- set ms = states('sensor.laundry_room_washer_machine_state') -%}
      {%- set prev = this.state if this is defined and this.state is defined and this.state not in ['unknown', 'unavailable', ''] else '' -%}
      {%- if ms in ['unknown', 'unavailable'] -%}{{ prev }}
      {%- elif ms in ['run', 'pause'] -%}
      {%- if prev -%}{{ prev }}
      {%- elif ms == 'run' -%}{{ states.sensor.laundry_room_washer_machine_state.last_changed.isoformat() }}
      {%- else -%}{{ states.sensor.laundry_room_washer_job_state.last_changed.isoformat() }}
      {%- endif -%}
      {%- endif -%}
  - name: Samsung washer display hours
    unique_id: samsung_washer_display_hours
    icon: mdi:monitor
    state: |-
      {%- set ms = states('sensor.laundry_room_washer_machine_state') -%}
      {%- set end = states('sensor.laundry_room_washer_completion_time') | as_datetime(none) -%}
      {%- set running = ms in ['run', 'pause'] and end is not none -%}
      {%- set m = ((end - (states.sensor.laundry_room_washer_machine_state.last_changed if ms == 'pause' else now())).total_seconds() / 60) | round(0, 'ceil') | int if running else 0 -%}
      {%- if running and m >= 60 -%}{{ m // 60 }}{%- endif -%}
  - name: Samsung washer display minutes
    unique_id: samsung_washer_display_minutes
    icon: mdi:monitor
    state: |-
      {%- set ms = states('sensor.laundry_room_washer_machine_state') -%}
      {%- set end = states('sensor.laundry_room_washer_completion_time') | as_datetime(none) -%}
      {%- set running = ms in ['run', 'pause'] and end is not none -%}
      {%- set m = ((end - (states.sensor.laundry_room_washer_machine_state.last_changed if ms == 'pause' else now())).total_seconds() / 60) | round(0, 'ceil') | int if running else 0 -%}
      {%- if running and m > 0 -%}{{ '%02d' | format(m % 60) }}{%- endif -%}
  - name: Samsung washer display progress
    unique_id: samsung_washer_display_progress
    icon: mdi:monitor
    state: |-
      {%- set ms = states('sensor.laundry_room_washer_machine_state') -%}
      {%- set end = states('sensor.laundry_room_washer_completion_time') | as_datetime(none) -%}
      {%- set start = states('sensor.samsung_washer_display_cycle_start') | as_datetime(none) -%}
      {%- set t = states.sensor.laundry_room_washer_machine_state.last_changed if ms == 'pause' else now() -%}
      {%- if ms in ['run', 'pause'] and end is not none and start is not none and end > start -%}
      {{ [[((t - start).total_seconds() / (end - start).total_seconds() * 20) | round(0) | int, 0] | max, 20] | min }}
      {%- else -%}0{%- endif -%}
  - name: Samsung dryer display cycle start
    unique_id: samsung_dryer_display_cycle_start
    icon: mdi:timer-play-outline
    state: |-
      {%- set ms = states('sensor.laundry_room_dryer_machine_state') -%}
      {%- set prev = this.state if this is defined and this.state is defined and this.state not in ['unknown', 'unavailable', ''] else '' -%}
      {%- if ms in ['unknown', 'unavailable'] -%}{{ prev }}
      {%- elif ms in ['run', 'pause'] -%}
      {%- if prev -%}{{ prev }}
      {%- elif ms == 'run' -%}{{ states.sensor.laundry_room_dryer_machine_state.last_changed.isoformat() }}
      {%- else -%}{{ states.sensor.laundry_room_dryer_job_state.last_changed.isoformat() }}
      {%- endif -%}
      {%- endif -%}
  - name: Samsung dryer display hours
    unique_id: samsung_dryer_display_hours
    icon: mdi:monitor
    state: |-
      {%- set ms = states('sensor.laundry_room_dryer_machine_state') -%}
      {%- set end = states('sensor.laundry_room_dryer_completion_time') | as_datetime(none) -%}
      {%- set running = ms in ['run', 'pause'] and end is not none -%}
      {%- set m = ((end - (states.sensor.laundry_room_dryer_machine_state.last_changed if ms == 'pause' else now())).total_seconds() / 60) | round(0, 'ceil') | int if running else 0 -%}
      {%- if running and m >= 60 -%}{{ m // 60 }}{%- endif -%}
  - name: Samsung dryer display minutes
    unique_id: samsung_dryer_display_minutes
    icon: mdi:monitor
    state: |-
      {%- set ms = states('sensor.laundry_room_dryer_machine_state') -%}
      {%- set end = states('sensor.laundry_room_dryer_completion_time') | as_datetime(none) -%}
      {%- set running = ms in ['run', 'pause'] and end is not none -%}
      {%- set m = ((end - (states.sensor.laundry_room_dryer_machine_state.last_changed if ms == 'pause' else now())).total_seconds() / 60) | round(0, 'ceil') | int if running else 0 -%}
      {%- if running and m > 0 -%}{{ '%02d' | format(m % 60) }}{%- endif -%}
  - name: Samsung dryer display progress
    unique_id: samsung_dryer_display_progress
    icon: mdi:monitor
    state: |-
      {%- set ms = states('sensor.laundry_room_dryer_machine_state') -%}
      {%- set end = states('sensor.laundry_room_dryer_completion_time') | as_datetime(none) -%}
      {%- set start = states('sensor.samsung_dryer_display_cycle_start') | as_datetime(none) -%}
      {%- set t = states.sensor.laundry_room_dryer_machine_state.last_changed if ms == 'pause' else now() -%}
      {%- if ms in ['run', 'pause'] and end is not none and start is not none and end > start -%}
      {{ [[((t - start).total_seconds() / (end - start).total_seconds() * 20) | round(0) | int, 0] | max, 20] | min }}
      {%- else -%}0{%- endif -%}
